name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run pack
      - name: Zip app
        run: |
          APP=$(find release -maxdepth 2 -name "*.app" | head -1)
          echo "Found app: $APP"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" token-sprite-mac-universal.zip
          ls -la token-sprite-mac-universal.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: token-sprite-mac-universal.zip
